; iMailBox - Boîte aux lettres connectée
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; Matériel réel : WEMOS D1 Mini Pro (ESP8266)
[env:d1_mini_pro]
platform = espressif8266
board = d1_mini_pro

; Simulation Wokwi : Wokwi ne simule pas l'ESP8266 -> ESP32 DevKit
[env:wokwi]
platform = espressif32
board = esp32dev
build_flags = -D SIMULATION
extra_scripts = post:scripts/merge_bin.py
